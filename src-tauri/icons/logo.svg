<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Outer ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accent)" stroke-width="12"/>

  <!-- Book icon -->
  <path d="M140 160 Q140 140 160 140 L240 140 Q250 140 250 150 L250 340 Q250 350 240 350 L160 350 Q140 350 140 330 Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M372 160 Q372 140 352 140 L272 140 Q262 140 262 150 L262 340 Q262 350 272 350 L352 350 Q372 350 372 330 Z" fill="#34d399" opacity="0.9"/>

  <!-- Book spine -->
  <rect x="246" y="140" width="20" height="210" rx="4" fill="#0f172a"/>

  <!-- Letters -->
  <text x="190" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="white" text-anchor="middle">A</text>
  <text x="320" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="white" text-anchor="middle">+</text>

  <!-- Small flag dots -->
  <circle cx="180" cy="320" r="8" fill="#ef4444"/>
  <circle cx="200" cy="320" r="8" fill="white"/>
  <circle cx="220" cy="320" r="8" fill="#3b82f6"/>
  <circle cx="300" cy="320" r="8" fill="#ef4444"/>
  <circle cx="320" cy="320" r="8" fill="white"/>
  <circle cx="340" cy="320" r="8" fill="#3b82f6"/>
</svg>
